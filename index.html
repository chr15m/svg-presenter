<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SVG Presenter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
    }
    #svg-display {
      width: 100%;
      height: 100%;
    }
    #file-input {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: white;
      padding: 5px;
      border-radius: 3px;
    }
    #slide-counter {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 14px;
    }
    #container:fullscreen {
      background: #000;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      font-size: 27px;
      line-height: 1.6;
    }
    #instructions h2 {
      margin-top: 0;
      font-size: 36px;
    }
  </style>
</head>
<body>
  <input type="file" id="file-input" accept=".svg">
  <div id="slide-counter"></div>
  <div id="container">
    <div id="instructions">
      <h2>SVG Presenter</h2>
      <p>Select an SVG file to begin</p>
      <p>← → Navigate slides | ↑ Toggle zoom | Click to fullscreen</p>
    </div>
  </div>
  
  <script>
    let currentSlideIndex = 0;
    let slides = [];
    let svgElement = null;
    let rootG = null;
    let selectedFile = null;
    let lastContent = null;
    let pollingInterval = null;
    let isZoomedOut = false;

    const fileInput = document.getElementById('file-input');
    const container = document.getElementById('container');
    const slideCounter = document.getElementById('slide-counter');
    const instructions = document.getElementById('instructions');

    fileInput.addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        currentSlideIndex = 0;
        loadSVG();
        startPolling();
      }
    });

    container.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          console.log('Error attempting to enable fullscreen:', err);
        });
      }
    });

    function screenToSVGCoords(svgElement, screenX, screenY, width, height) {
      const pt = svgElement.createSVGPoint();
      const ctm = svgElement.getScreenCTM();
      
      pt.x = screenX;
      pt.y = screenY;
      const svgPt = pt.matrixTransform(ctm.inverse());
      
      const scaleX = width / ctm.a;
      const scaleY = height / ctm.d;
      
      return {
        x: svgPt.x,
        y: svgPt.y,
        width: scaleX,
        height: scaleY
      };
    }

    function loadSVG() {
      if (!selectedFile) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        
        if (content === lastContent) return;
        lastContent = content;

        if (instructions) {
          instructions.style.display = 'none';
        }

        container.innerHTML = content;
        svgElement = container.querySelector('svg');
        
        if (!svgElement) {
          console.log('No SVG element found');
          return;
        }

        const originalViewBox = svgElement.getAttribute('viewBox');
        console.log('SVG original viewBox:', originalViewBox);
        console.log('SVG width/height:', svgElement.getAttribute('width'), svgElement.getAttribute('height'));

        rootG = svgElement.querySelector('g[inkscape\\:groupmode="layer"]');
        if (!rootG) {
          console.log('No root layer group found');
          return;
        }

        const allSlides = Array.from(rootG.children).filter(child => 
          child.tagName.toLowerCase() === 'g'
        );

        const svgRect = svgElement.getBoundingClientRect();

        slides = allSlides
          .map((slide, i) => {
            const bbox = slide.getBBox();
            const clientRect = slide.getBoundingClientRect();
            const screenX = clientRect.left - svgRect.left;
            const screenY = clientRect.top - svgRect.top;
            const svgCoords = screenToSVGCoords(svgElement, clientRect.left, clientRect.top, clientRect.width, clientRect.height);
            return { 
              element: slide, 
              bbox, 
              screenX, 
              screenY,
              svgX: svgCoords.x,
              svgY: svgCoords.y,
              svgWidth: svgCoords.width,
              svgHeight: svgCoords.height,
              originalIndex: i 
            };
          })
          .filter(slide => slide.bbox.width > 0 && slide.bbox.height > 0);

        console.log('Found non-empty slides:', slides.length, 'out of', allSlides.length);

        const X_TOLERANCE = 10;
        
        slides.sort((a, b) => {
          const xDiff = Math.abs(a.screenX - b.screenX);
          if (xDiff < X_TOLERANCE) {
            return a.screenY - b.screenY;
          }
          return a.screenX - b.screenX;
        });

        console.log('Sorted slides:');
        slides.forEach((slide, i) => {
          console.log(`  ${i}: id=${slide.element.getAttribute('id')}, screenX=${slide.screenX.toFixed(1)}, screenY=${slide.screenY.toFixed(1)}, svgX=${slide.svgX.toFixed(1)}, svgY=${slide.svgY.toFixed(1)}`);
        });

        if (originalViewBox) {
          const parts = originalViewBox.split(/\s+/).map(Number);
          slides.unshift({
            element: null,
            bbox: { x: parts[0], y: parts[1], width: parts[2], height: parts[3] },
            screenX: 0,
            screenY: 0,
            svgX: parts[0],
            svgY: parts[1],
            svgWidth: parts[2],
            svgHeight: parts[3],
            originalIndex: -1,
            isOriginalView: true
          });
        }

        slides.forEach((slide, i) => {
          if (!slide.element) return;
          
          const bbox = slide.bbox;
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', bbox.x);
          rect.setAttribute('y', bbox.y);
          rect.setAttribute('width', bbox.width);
          rect.setAttribute('height', bbox.height);
          rect.setAttribute('fill', 'transparent');
          rect.setAttribute('stroke', 'none');
          rect.setAttribute('class', 'slide-clickable');
          rect.style.cursor = 'pointer';
          
          rect.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isZoomedOut) {
              showSlide(i);
            }
          });
          
          slide.element.appendChild(rect);
        });

        const rootBBox = rootG.getBBox();
        console.log('Root layer bbox:', rootBBox);

        if (currentSlideIndex >= slides.length) {
          currentSlideIndex = slides.length - 1;
        }
        if (currentSlideIndex < 0) {
          currentSlideIndex = 0;
        }

        if (slides.length > 0) {
          showSlide(currentSlideIndex);
        }
      };
      reader.readAsText(selectedFile);
    }

    function showSlide(index) {
      if (!svgElement || slides.length === 0) return;
      if (index < 0 || index >= slides.length) return;

      currentSlideIndex = index;
      isZoomedOut = false;

      const slide = slides[currentSlideIndex];

      const viewportWidth = container.clientWidth;
      const viewportHeight = container.clientHeight;
      const viewportAspect = viewportWidth / viewportHeight;
      
      const slideAspect = slide.svgWidth / slide.svgHeight;
      
      let viewBoxX = slide.svgX;
      let viewBoxY = slide.svgY;
      let viewBoxWidth = slide.svgWidth;
      let viewBoxHeight = slide.svgHeight;
      
      if (viewportAspect > slideAspect) {
        const newWidth = slide.svgHeight * viewportAspect;
        viewBoxX = slide.svgX - (newWidth - slide.svgWidth) / 2;
        viewBoxWidth = newWidth;
      } else {
        const newHeight = slide.svgWidth / viewportAspect;
        viewBoxY = slide.svgY - (newHeight - slide.svgHeight) / 2;
        viewBoxHeight = newHeight;
      }

      const viewBoxStr = `${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`;
      svgElement.setAttribute('viewBox', viewBoxStr);

      updateCounter();
      console.log('Showing slide:', currentSlideIndex);
      console.log('  SVG coords:', slide.svgX, slide.svgY, slide.svgWidth, slide.svgHeight);
      console.log('  ViewBox set to:', viewBoxStr);
      console.log('  Slide id:', slide.element ? slide.element.getAttribute('id') : 'ORIGINAL VIEW');
      console.log('  Is original view:', slide.isOriginalView || false);
    }

    function toggleZoom() {
      if (isZoomedOut) {
        showSlide(currentSlideIndex);
      } else {
        zoomOut();
      }
    }

    function zoomOut() {
      if (!svgElement || !rootG) return;

      const bbox = rootG.getBBox();
      const viewBoxStr = `${bbox.x} ${bbox.y} ${bbox.width} ${bbox.height}`;
      svgElement.setAttribute('viewBox', viewBoxStr);

      isZoomedOut = true;
      updateCounter();
      console.log('Zoomed out to full canvas');
      console.log('  Root bbox:', bbox);
      console.log('  ViewBox set to:', viewBoxStr);
    }

    function updateCounter() {
      if (isZoomedOut) {
        slideCounter.textContent = 'Full Canvas';
      } else {
        slideCounter.textContent = 
          `${currentSlideIndex + 1} / ${slides.length}`;
      }
    }

    function nextSlide() {
      if (slides.length === 0) return;
      const nextIndex = (currentSlideIndex + 1) % slides.length;
      showSlide(nextIndex);
    }

    function prevSlide() {
      if (slides.length === 0) return;
      const prevIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
      showSlide(prevIndex);
    }

    function startPolling() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
      }

      pollingInterval = setInterval(() => {
        if (!selectedFile) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
          loadSVG();
        };
        reader.readAsText(selectedFile);
      }, 250);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        toggleZoom();
      }
    });
  </script>
</body>
</html>
